<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>ShareScreen</title>
    <meta name="description" content="Share your screen with a room code and PIN, or watch someone else's, in the browser.">
    <meta name="theme-color" content="#4c6fff">
    <meta name="color-scheme" content="light dark">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="manifest.webmanifest">
    <style>
        :root { --page: #fbf8ff; --text: #1b1b21; --muted: #46464f; --ring: #dde1ff; }
        @media (prefers-color-scheme: dark) {
            :root { --page: #121318; --text: #e4e1e9; --muted: #c7c5d0; --ring: #2637b4; }
        }
        html, body { margin: 0; height: 100%; overflow: hidden; background: var(--page); }
        #splash {
            position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
            justify-content: center; gap: 20px; background: var(--page); color: var(--text);
            font-family: system-ui, sans-serif; transition: opacity .3s ease; z-index: 10;
        }
        #splash.done { opacity: 0; pointer-events: none; }
        #splash img { width: 88px; height: 88px; }
        #splash .spinner {
            width: 28px; height: 28px; border-radius: 50%; border: 3px solid var(--ring);
            border-top-color: #4c6fff; animation: spin 1s linear infinite;
        }
        #splash p { margin: 0; color: var(--muted); font-size: 14px; text-align: center; padding: 0 24px; max-width: 420px; }
        #splash button {
            font: inherit; font-size: 15px; padding: 10px 22px; border: 0; border-radius: 20px;
            background: #4c6fff; color: #fff; cursor: pointer;
        }
        #unsupported { display: none; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
    <script>
        const supportsWasmGc = typeof WebAssembly === "object" &&
            WebAssembly.validate(new Uint8Array([0, 97, 115, 109, 1, 0, 0, 0, 1, 5, 1, 95, 1, 120, 0]));
        document.documentElement.lang = (navigator.language || "en").slice(0, 2);
        const handoffText = document.documentElement.lang === "tr" ? {
            opening: "ShareScreen uygulaması açılıyor…",
            opened: "Davet ShareScreen uygulamasına gönderildi. Uygulama açılmadıysa tarayıcıda devam edebilirsin.",
            browser: "Tarayıcıda devam et",
        } : {
            opening: "Opening the ShareScreen app…",
            opened: "The invite was sent to the ShareScreen app. If the app did not open, continue in the browser.",
            browser: "Continue in the browser",
        };
        const HANDOFF_MILLIS = 2500;

        function startWebApp() {
            if (supportsWasmGc) {
                const script = document.createElement("script");
                script.src = "webApp.js";
                document.head.appendChild(script);
            } else {
                document.querySelector("#splash .spinner").style.display = "none";
                document.getElementById("loading").style.display = "none";
                document.getElementById("unsupported").style.display = "block";
            }
        }

        // An invite (#s=…&r=…&p=…) first goes to the app on Android and desktop. w=1 marks the way
        // back to the browser, which Chrome on Android takes by itself when the app is not installed.
        function appLink() {
            const invite = new URLSearchParams(location.hash.slice(1));
            const server = invite.get("s"), room = invite.get("r"), pin = invite.get("p"), name = invite.get("n");
            if (!server || !room || !pin || invite.has("w")) return null;
            const agent = navigator.userAgent;
            const android = /Android/.test(agent);
            const ios = /iPhone|iPad|iPod/.test(agent) || (/Macintosh/.test(agent) && navigator.maxTouchPoints > 1);
            if (ios || !(android || /Windows|Macintosh|Linux|CrOS/.test(agent))) return null;
            const query = new URLSearchParams({ s: server, r: room, pin: pin });
            if (name) query.set("n", name);
            if (android) {
                invite.set("w", "1");
                const browser = location.href.split("#")[0] + "#" + invite;
                return {
                    url: "intent://join?" + query + "#Intent;scheme=sharescreen;S.browser_fallback_url=" +
                        encodeURIComponent(browser) + ";end",
                    navigate: true,
                };
            }
            return { url: "sharescreen://join?" + query, navigate: /Chrome\//.test(agent) };
        }

        // The page loses focus or goes to the background when the app or the browser's prompt for it
        // opens. Otherwise no app took the link and the invite continues in the browser.
        function openInApp(link) {
            document.getElementById("loading").textContent = handoffText.opening;
            let left = false;
            const leave = () => { left = true; };
            const hide = () => { if (document.hidden) leave(); };
            addEventListener("blur", leave);
            document.addEventListener("visibilitychange", hide);
            if (link.navigate) {
                location.href = link.url;
            } else {
                const frame = document.createElement("iframe");
                frame.hidden = true;
                frame.src = link.url;
                document.body.appendChild(frame);
            }
            setTimeout(() => {
                removeEventListener("blur", leave);
                document.removeEventListener("visibilitychange", hide);
                if (left) offerBrowser(); else startWebApp();
            }, HANDOFF_MILLIS);
        }

        function offerBrowser() {
            const spinner = document.querySelector("#splash .spinner");
            const loading = document.getElementById("loading");
            const button = document.getElementById("browser");
            spinner.style.display = "none";
            loading.textContent = handoffText.opened;
            button.textContent = handoffText.browser;
            button.hidden = false;
            button.onclick = () => {
                button.hidden = true;
                spinner.style.display = "";
                loading.textContent = "ShareScreen";
                startWebApp();
            };
        }

        addEventListener("DOMContentLoaded", () => {
            const link = appLink();
            if (link) openInApp(link); else startWebApp();
        });
    </script>
</head>
<body>
    <div id="splash">
        <img src="favicon.svg" alt="">
        <div class="spinner"></div>
        <p id="loading">ShareScreen</p>
        <button id="browser" type="button" hidden></button>
        <p id="unsupported">This browser is too old for ShareScreen. Use a current version of Chrome, Edge, Firefox or Safari.</p>
    </div>
    <noscript>ShareScreen needs JavaScript.</noscript>
</body>
</html>
