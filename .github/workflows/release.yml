name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Tag and version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The tag matches the version
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(grep '^sharescreen.version=' gradle.properties | cut -d= -f2)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::The tag $TAG does not match version $version in gradle.properties"
            exit 1
          fi

  android:
    name: Android
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SHARESCREEN_SERVER: ${{ secrets.SHARESCREEN_SERVER }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The ANDROID_KEYSTORE_BASE64 secret is missing"
            exit 1
          fi
          keys="$RUNNER_TEMP/keys"
          mkdir -p "$keys"
          echo "$KEYSTORE_BASE64" | base64 -d > "$keys/release.jks"
          {
            echo "storeFile=$keys/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > "$keys/keystore.properties"
          echo "SHARESCREEN_KEYSTORE_PROPERTIES=$keys/keystore.properties" >> "$GITHUB_ENV"
      - run: ./gradlew --console=plain :androidApp:assembleFullRelease :androidApp:assembleLiteRelease
      - name: Name and check the packages
        run: |
          mkdir -p dist
          cp androidApp/build/outputs/apk/full/release/androidApp-full-release.apk "dist/ShareScreen-$TAG.apk"
          cp androidApp/build/outputs/apk/lite/release/androidApp-lite-release.apk "dist/ShareScreen-$TAG-lite.apk"
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for apk in dist/*.apk; do
            echo "$apk"
            "$apksigner" verify --print-certs "$apk" | grep "SHA-256"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android
          path: dist/*
          if-no-files-found: error

  desktop:
    name: Desktop (${{ matrix.os }})
    needs: check
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            tasks: :desktopApp:packageMsi :desktopApp:portableZip
            paths: |
              desktopApp/build/compose/binaries/main/msi/*.msi
              desktopApp/build/compose/binaries/main/portable/*.zip
          - os: macos-latest
            tasks: :desktopApp:packageDmg
            paths: desktopApp/build/compose/binaries/main/dmg/*.dmg
          - os: macos-15-intel
            tasks: :desktopApp:packageDmg
            paths: desktopApp/build/compose/binaries/main/dmg/*.dmg
          - os: ubuntu-latest
            tasks: :desktopApp:packageDeb
            paths: desktopApp/build/compose/binaries/main/deb/*.deb
    env:
      SHARESCREEN_SERVER: ${{ secrets.SHARESCREEN_SERVER }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Install packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot
      - run: ./gradlew --console=plain ${{ matrix.tasks }}
      - name: Show the packaging logs
        if: failure()
        shell: bash
        run: |
          find desktopApp/build/compose/logs -type f -name '*.txt' -exec sh -c 'echo "== $1"; cat "$1"' _ {} \;
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-${{ matrix.os }}
          path: ${{ matrix.paths }}
          if-no-files-found: error

  publish:
    name: Draft release
    if: github.ref_type == 'tag'
    needs: [android, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        working-directory: artifacts
        run: sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: artifacts/*
